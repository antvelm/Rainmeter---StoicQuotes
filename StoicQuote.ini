[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!CommandMeasure MeasureQuoteText "Update"]
LeftMouseUpAction=[!CommandMeasure MeasureQuoteText "Update"]

[Metadata]
Name=Stoic Quote
Author=Anton
Information=Displays a random quote from stoic-quotes.com, styled after antvelm.net/stoicquotes. Click to fetch a new quote.
Version=3.0
License=MIT

[Variables]
FontFace=Georgia
FontColorQuote=235,230,220,255
FontColorAccent=190,160,105,220
; Characters per line before wrapping. Lower = narrower, taller block.
MaxChars=42
; Horizontal centre point. With StringAlign=Center, X is the CENTRE of the
; text, not its left edge.
CenterX=235
Pad=15

; ----------------------------------------------------------------------
; Measures
; ----------------------------------------------------------------------

; Downloads https://www.stoic-quotes.com/api/quote, which returns JSON like:
;   {"text":"...","author":"..."}
; and captures the "text" field via the first RegExp group.
[MeasureQuoteText]
Measure=Plugin
Plugin=WebParser
URL=https://www.stoic-quotes.com/api/quote
RegExp=(?siU)"text":"(.*)","author":"(.*)"
StringIndex=1
UpdateRate=3600
FinishAction=[!UpdateMeasure MeasureWrap][!UpdateMeter *][!Redraw]

; Reuses the page already downloaded by MeasureQuoteText (no second request)
; and captures the "author" field via the second RegExp group.
[MeasureQuoteAuthor]
Measure=Plugin
Plugin=WebParser
URL=[MeasureQuoteText]
StringIndex=2
UpdateRate=3600
Substitute="Seneca":"S E N E C A","Marcus Aurelius":"M A R C U S   A U R E L I U S","Epictetus":"E P I C T E T U S"

; Breaks the quote into multiple lines at word boundaries (see Wrap.lua).
[MeasureWrap]
Measure=Script
ScriptFile=#CURRENTPATH#Wrap.lua

; ----------------------------------------------------------------------
; Meters - no background card, floats on the wallpaper like the reference.
; All use StringAlign=Center, so X = the centre point of the text.
; ----------------------------------------------------------------------

[MeterLabel]
Meter=String
X=#CenterX#
Y=#Pad#
FontFace=#FontFace#
FontSize=8
FontColor=#FontColorAccent#
StringAlign=Center
AntiAlias=1
Text="-  S T O I C O R V M   V E R B A  -"

[MeterQuote]
Meter=String
X=#CenterX#
Y=28R
FontFace=#FontFace#
FontSize=15
FontColor=#FontColorQuote#
StringStyle=Italic
StringAlign=Center
AntiAlias=1
Text=[&MeasureWrap:GetText()]
DynamicVariables=1

[MeterDivider]
Meter=Shape
X=(#CenterX#-30)
Y=22R
Shape=Line 0,0,60,0 | StrokeWidth 1 | Stroke Color #FontColorAccent#
DynamicVariables=1

[MeterAuthor]
Meter=String
MeasureName=MeasureQuoteAuthor
X=#CenterX#
Y=18R
FontFace=#FontFace#
FontSize=10
FontColor=#FontColorAccent#
StringAlign=Center
AntiAlias=1
Text="%1"
DynamicVariables=1
